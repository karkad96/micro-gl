<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>micro-gl &mdash; rational Poincar&eacute; geodesics</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <strong>Unit-disk geodesics through rational points</strong>
      <div class="scene-legend" aria-label="Scene colors">
        <span><i class="scene-swatch boundary"></i>Boundary</span>
        <span><i class="scene-swatch geodesic"></i>Geodesics</span>
        <span><i class="scene-swatch point"></i>Rational points</span>
      </div>
      <div class="hud-hint">Each coordinate is reduced p/q with q &le; N</div>
      <div class="hud-hint">
        Right-drag to pan &middot; wheel or pinch to zoom
      </div>
    </div>
    <div id="geodesic-stats" aria-live="polite">
      <div>
        <span id="triple-symbol">T(N)</span> =
        <span class="num" id="triple-count">--</span> ordered triples of
        distinct points
      </div>
      <div id="geodesic-detail">Building geometry&hellip;</div>
      <div id="geodesic-filter"></div>
    </div>
    <div id="error"></div>
    <script type="module" src="./examples/main.js"></script>
  </body>
</html>
