<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>micro-gl — WebGPU demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="speed-control">
      <label for="simulation-speed">Simulation speed</label>
      <input
        id="simulation-speed"
        type="range"
        min="0"
        max="4"
        step="0.1"
        value="1"
      />
      <output id="simulation-speed-value" for="simulation-speed">1.0×</output>
    </div>
    <div class="charge-legend" aria-label="Particle charge colors">
      <span><i class="charge-swatch positive"></i>Positive</span>
      <span><i class="charge-swatch negative"></i>Negative</span>
      <span><i class="charge-swatch neutral"></i>Neutral</span>
    </div>
    <div class="hud-hint">0× pauses · T switches camera · reload randomizes</div>
  </div>
  <div id="fps">
    <div><span class="num" id="fps-value">--</span> fps</div>
    <div id="fps-detail">-- ms &middot; 0 objects</div>
  </div>
  <div id="error"></div>
  <script type="module" src="./examples/main.js"></script>
</body>

</html>
